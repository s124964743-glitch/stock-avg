name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build signed release APK
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon 2>&1 | tee build.log
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk StockAvg.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StockAvg-apk
          path: StockAvg.apk
      - name: Publish release (direct APK download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "第 ${{ github.run_number }} 版"
          files: StockAvg.apk
          make_latest: true
      - name: Publish build errors on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "^e: |error:|What went wrong|FAILED" -A4 build.log | head -c 60000 > errors.txt || true
          [ -s errors.txt ] || tail -n 80 build.log > errors.txt
          gh release delete buildlog --cleanup-tag -y -R "${{ github.repository }}" || true
          gh release create buildlog errors.txt --prerelease --title "build errors" --notes-file errors.txt -R "${{ github.repository }}"
